<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Team LineShine – AKT26 Hackathon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A5C"/>
      <stop offset="1" stop-color="#1C5AA6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D49A2A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5C25B"/>
      <stop offset="1" stop-color="#FFE6A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE6A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <!-- shining data line -->
  <polyline points="660,250 730,232 790,244 850,196 910,210 970,160 1030,172 1090,118 1150,128 1210,78"
            fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFE6A8">
    <circle cx="850" cy="196" r="5"/><circle cx="970" cy="160" r="5"/><circle cx="1090" cy="118" r="5"/>
  </g>
  <circle cx="1210" cy="78" r="38" fill="url(#glow)"/>
  <circle cx="1210" cy="78" r="9" fill="#FFFFFF"/>
  <!-- text -->
  <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F5C25B" letter-spacing="4">AKT26 · AL-KHAWARIZMI TOUR HACKATHON</text>
  <text x="62" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF">Team LineShine</text>
  <text x="64" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D6E4F7">HPC &amp; AI track · Team ID 1065 · Oct 3 – Nov 7, 2026</text>
  <rect x="64" y="252" width="120" height="5" rx="2.5" fill="#D49A2A"/>
</svg>
